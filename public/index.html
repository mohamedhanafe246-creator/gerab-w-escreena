<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جراب واسكرينة</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color-scheme:dark;--bg:#0a1428;--panel:#14243e;--fg:#f2f7ff;--muted:#b1c0d4;--accent:#40a9ff;--line:#304563}body.light{color-scheme:light;--bg:#eef5fc;--panel:#fff;--fg:#172942;--muted:#526a83;--accent:#0969b5;--line:#d5e2ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}button,input,select,textarea{font:inherit}button{cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 15px}button.secondary{background:transparent;color:var(--fg);border:1px solid var(--line)}button.danger{background:#b83c52}input,select,textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:11px;min-width:0}textarea{min-height:125px}label{display:block;margin:8px 0 5px;color:var(--muted)}h1{font-size:24px;margin:0 0 18px}h2{font-size:19px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:var(--panel);border-left:1px solid var(--line);padding:20px 12px}.brand{font-size:23px;font-weight:bold;color:var(--accent);margin:8px 10px 25px}.nav{display:block;width:100%;text-align:right;background:transparent;color:var(--fg);padding:12px;margin:3px 0}.nav.active{background:var(--accent);color:white}.main{padding:25px;min-width:0}.panel{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:14px;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.big{font-size:27px;font-weight:bold;color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:right;padding:11px;border-bottom:1px solid var(--line)}th{color:var(--muted)}small,.muted{color:var(--muted)}.hidden{display:none!important}.login{max-width:420px;margin:8vh auto;padding:24px}.notice{padding:12px;border-radius:9px;margin:10px 0;background:var(--panel);border:1px solid var(--line)}.error{color:#ff7f8e}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{display:inline-block;padding:6px 10px;border-radius:20px;background:var(--bg)}@media(max-width:700px){.layout{display:block}.sidebar{position:relative;padding:10px}.brand{margin:6px}.menu{display:flex;overflow:auto;gap:5px}.nav{width:auto;white-space:nowrap}.main{padding:12px}.login{margin:20px auto}}
</style></head><body><section id="auth" class="login panel"><h1>📱 جراب واسكرينة</h1><p class="muted">نظام المبيعات والمخزون المتصل بقاعدة البيانات</p><div id="setup" class="hidden"><h2>إنشاء حساب المدير لأول مرة</h2><label>اسم المستخدم</label><input id="su"><label>الاسم الظاهر</label><input id="sd"><label>كلمة مرور قوية (12 حرف على الأقل)</label><input id="sp" type="password"><p><button onclick="setup()">إنشاء المدير</button></p></div><div id="login"><label>اسم المستخدم</label><input id="lu"><label>كلمة المرور</label><input id="lp" type="password"><p><button onclick="login()">دخول</button></p></div><div id="authMsg" class="error"></div></section><section id="app" class="layout hidden"><aside class="sidebar"><div class="brand">📱 جراب واسكرينة</div><div class="menu" id="menu"></div><p class="muted" id="who"></p><button class="secondary" onclick="logout()">تسجيل خروج</button></aside><main class="main"><div class="top"><h1 id="title">الرئيسية</h1><button class="secondary" onclick="toggleTheme()">☀️ / 🌙</button></div><div id="message"></div><div id="content"></div></main></section><script>
let token=sessionStorage.getItem('token')||'',user=null,products=[],periods={},current='home';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2});const manager=()=>user?.role==='manager';
async function api(path,method='GET',data){const r=await fetch('/api/'+path,{method,headers:{...(token?{Authorization:'Bearer '+token}:{}),...(data?{'Content-Type':'application/json'}:{})},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'حدث خطأ');return j}
function msg(s,bad=false){$('message').innerHTML=`<div class="notice ${bad?'error':''}">${esc(s)}</div>`;setTimeout(()=>{$('message').innerHTML=''},6000)}async function safe(fn){try{await fn()}catch(e){msg(e.message,true)}}
async function init(){document.body.classList.toggle('light',localStorage.theme==='light');if(token){try{user=(await api('me')).user;showApp();return}catch{token='';sessionStorage.removeItem('token')}}try{const s=await api('setup/status');$('setup').classList.toggle('hidden',!s.needs_setup);$('login').classList.toggle('hidden',s.needs_setup)}catch(e){$('authMsg').textContent=e.message+' — تأكد من تنفيذ schema.sql وربط DB'}}
async function setup(){try{await api('setup','POST',{username:$('su').value.trim(),display_name:$('sd').value.trim(),password:$('sp').value});$('authMsg').textContent='تم إنشاء المدير. سجل الدخول.';$('setup').classList.add('hidden');$('login').classList.remove('hidden')}catch(e){$('authMsg').textContent=e.message}}
async function login(){try{const j=await api('login','POST',{username:$('lu').value.trim(),password:$('lp').value});token=j.token;sessionStorage.setItem('token',token);user=j.user;showApp()}catch(e){$('authMsg').textContent=e.message}}
async function logout(){await safe(()=>api('logout','POST'));sessionStorage.removeItem('token');location.reload()}
function toggleTheme(){localStorage.theme=document.body.classList.contains('light')?'dark':'light';document.body.classList.toggle('light')}
const tabs=[['home','الرئيسية'],['sales','مبيعات اليوم'],['month','مبيعات الشهر'],['inventory','المخزون'],['add','إضافة بضاعة'],['moves','حركة المخزون'],['stocktake','الجرد'],['reports','تقارير المبيعات'],['users','إدارة العمال'],['performance','أداء العمال'],['audit','سجل العمليات'],['settings','الإعدادات']];function showApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user.display_name+' — '+(manager()?'مدير':'عامل');$('menu').innerHTML=tabs.filter(x=>manager()||['home','sales','inventory','settings'].includes(x[0])).map(([k,v])=>`<button class="nav" id="nav-${k}" onclick="page('${k}')">${v}</button>`).join('');page('home')}
function panel(s){return `<div class="panel">${s}</div>`}function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${head.length}">لا توجد بيانات</td></tr>`}</tbody></table></div>`}function tr(cells){return `<tr>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`}
async function load(){periods=await api('periods');products=(await api('products')).items}
async function page(k){current=k;const t=tabs.find(x=>x[0]===k);if(!t||(!manager()&&!['home','sales','inventory','settings'].includes(k)))return;document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));$('nav-'+k)?.classList.add('active');$('title').textContent=t[1];$('content').innerHTML=panel('جارٍ التحميل...');try{await load();await render(k)}catch(e){$('content').innerHTML=panel(`<span class="error">${esc(e.message)}</span>`)}}
const periodBox=()=>`<div class="cards"><div class="panel">اليوم: <b>${periods.day?'مفتوح':'مغلق'}</b><p class="muted">${esc(periods.day?.label||'لا يوجد يوم مفتوح')}</p><button onclick="period('day','${periods.day?'close':'open'}')">${periods.day?'قفل اليوم':'بدء يوم جديد'}</button></div><div class="panel">الشهر: <b>${periods.month?'مفتوح':'مغلق'}</b><p class="muted">${esc(periods.month?.label||'لا يوجد شهر مفتوح')}</p><button onclick="period('month','${periods.month?'close':'open'}')">${periods.month?'قفل الشهر':'بدء شهر جديد'}</button></div></div>`;
async function period(kind,action){if(!confirm(`تأكيد ${action==='open'?'فتح':'قفل'} ${kind==='day'?'اليوم':'الشهر'}؟`))return;await safe(async()=>{await api('periods','POST',{kind,action,label:prompt('اسم الفترة (يمكن تركه كما هو)',new Date().toLocaleDateString('ar-EG'))||new Date().toLocaleDateString('ar-EG')});msg('تمت العملية');page(current)})}
const catSelect=id=>`<select id="${id}"><option value="1">إكسسوارات</option><option value="2">موبايلات</option><option value="3">قطع غيار</option></select>`;
const productTable=()=>table(['الصنف','القسم','الكمية','الحد الأدنى','الحالة'],products.map(p=>tr([esc(p.name),esc(p.category),fmt(p.quantity),fmt(p.min_quantity),p.quantity<=p.min_quantity?'<span class="error">مخزون منخفض</span>':'متوفر'])));
const saleTable=(items,actions=false)=>table(['التاريخ','الصنف','الكمية','المبلغ','العامل',...(actions?['إجراء']:[])],items.map(s=>tr([esc(s.created_at),esc(s.product_name),fmt(s.quantity),fmt(s.amount),esc(s.worker),...(actions?[`<button class="secondary" onclick="editSale(${s.id},${s.quantity},${s.amount})">تعديل</button> <button class="danger" onclick="deleteSale(${s.id})">حذف</button>`]:[])])));
async function render(k){const c=$('content');if(k==='home'){const d=await api('sales?mode=day');let m=manager()?await api('sales?mode=month'):null;c.innerHTML=periodBox()+`<div class="cards">${panel(`مبيعات اليوم<div class="big">${fmt(d.total)} ج.م</div>`)}${manager()?panel(`مبيعات الشهر<div class="big">${fmt(m.total)} ج.م</div>`):''}${panel(`عدد الأصناف<div class="big">${products.length}</div>`)}${panel(`أصناف منخفضة<div class="big">${products.filter(x=>x.quantity<=x.min_quantity).length}</div>`)}</div>`}
else if(k==='sales'){const d=await api('sales?mode=day');c.innerHTML=panel(`<h2>تسجيل بيع جديد</h2><div class="grid"><div><label>اسم الصنف (يمكن كتابة صنف غير موجود)</label><input id="sname" list="productnames" placeholder="ابحث أو اكتب اسم الصنف"><datalist id="productnames">${products.map(p=>`<option value="${esc(p.name)}">${esc(p.category)}</option>`).join('')}</datalist></div><div><label>الكمية</label><input type="number" min="1" value="1" id="sqty"></div><div><label>إجمالي مبلغ البيع (جنيه)</label><input type="number" min="0" step="0.01" id="samount"></div></div><p><button onclick="addSale()">إضافة البيع</button></p>`)+panel(`<h2>مبيعات اليوم — ${fmt(d.total)} جنيه</h2>${saleTable(d.items,manager())}`)}
else if(k==='month'){const d=await api('sales?mode=month');const daily={};d.items.forEach(s=>{const key=s.created_at.slice(0,10);daily[key]=(daily[key]||0)+s.amount});c.innerHTML=panel(`<h2>إجمالي الشهر: ${fmt(d.total)} جنيه</h2>${table(['التاريخ','الإجمالي'],Object.entries(daily).map(([x,y])=>tr([x,fmt(y)])))}`)+panel(`<h2>تفاصيل المبيعات</h2>${saleTable(d.items,true)}`)}
else if(k==='inventory')c.innerHTML=panel(`<h2>المخزون الحالي</h2><input id="filter" placeholder="بحث عن صنف" oninput="filterProducts()"><div id="prodTable">${productTable()}</div>`);
else if(k==='add')c.innerHTML=panel(`<h2>إضافة عدة أصناف دفعة واحدة</h2><p class="muted">كل سطر: اسم المنتج | الكمية المضافة | الحد الأدنى. الكميات تتجمع تلقائياً، والأسعار لا تُخزن في المخزون.</p><label>القسم</label>${catSelect('cat')}<label>الأصناف</label><textarea id="batch" placeholder="جراب سامسونج A15 - سادة | 10 | 5&#10;جراب سامسونج A15 - أشكال | 15 | 5"></textarea><p><button onclick="batchAdd()">حفظ كل البضاعة</button></p>`);
else if(k==='moves'){const d=await api('stock/moves');c.innerHTML=panel(`<h2>حركة المخزون</h2>${table(['التاريخ','الصنف','التغير','قبل','بعد','السبب','المستخدم'],d.items.map(x=>tr([esc(x.created_at),esc(x.product_name),fmt(x.delta),fmt(x.before_quantity),fmt(x.after_quantity),esc(x.reason),esc(x.actor)])))}`)}
else if(k==='stocktake')c.innerHTML=panel(`<h2>جرد وتعديل المخزون</h2><label>الصنف</label><select id="stockId">${products.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.quantity})</option>`).join('')}</select><label>الكمية الصحيحة</label><input id="stockQty" type="number" value="0"><label>سبب التعديل</label><input id="stockReason"><p><button onclick="stocktake()">حفظ الجرد</button></p>`);
else if(k==='reports'){const r=await api('reports');const d=await api('sales?mode=archive');c.innerHTML=panel(`<h2>أرشيف الأيام والشهور</h2>${table(['النوع','الاسم','بداية','نهاية'],r.periods.map(p=>tr([p.kind==='day'?'يوم':'شهر',esc(p.label),esc(p.opened_at),esc(p.closed_at||'مفتوح')])))}`)+panel(`<h2>بحث في كل المبيعات</h2><input id="reportFilter" placeholder="ابحث بالمنتج أو التاريخ أو العامل" oninput="filterReport()"><div id="reportTable"></div>`);window.reportItems=d.items;filterReport()}
else if(k==='users'){const d=await api('users');c.innerHTML=panel(`<h2>إنشاء حساب عامل أو مدير</h2><div class="grid"><div><label>اسم المستخدم</label><input id="un"></div><div><label>الاسم الظاهر</label><input id="ud"></div><div><label>كلمة المرور (12 حرف على الأقل)</label><input id="up" type="password"></div><div><label>الصلاحية</label><select id="ur"><option value="worker">عامل</option><option value="manager">مدير</option></select></div></div><p><button onclick="createUser()">إضافة الحساب</button></p>`)+panel(`<h2>الحسابات</h2>${table(['المستخدم','الاسم','الدور','الحالة'],d.items.map(u=>tr([esc(u.username),esc(u.display_name),u.role==='manager'?'مدير':'عامل',u.active?'نشط':'معطل'])))}`)}
else if(k==='performance'){const r=await api('reports');c.innerHTML=panel(`<h2>أداء العمال — إجمالي جميع الفترات</h2>${table(['العامل','عدد المبيعات','الإجمالي'],r.workers.map(w=>tr([esc(w.display_name),fmt(w.sales_count),fmt(w.total)])))}`)}
else if(k==='audit'){const r=await api('audit');c.innerHTML=panel(`<h2>سجل العمليات</h2>${table(['الوقت','المستخدم','العملية','النوع','التفاصيل'],r.items.map(x=>tr([esc(x.created_at),esc(x.actor),esc(x.action),esc(x.entity),esc(x.details)])))}`)}
else if(k==='settings')c.innerHTML=panel(`<h2>الإعدادات</h2><p>المستخدم: ${esc(user.display_name)}</p><p>الدور: ${manager()?'مدير':'عامل'}</p><p>التوقيت المرجعي: مصر. الفترات لا تُغلق تلقائياً.</p><button onclick="toggleTheme()">تغيير المظهر</button>`)}
function filterProducts(){const q=$('filter').value.toLowerCase();$('prodTable').innerHTML=table(['الصنف','القسم','الكمية','الحد الأدنى','الحالة'],products.filter(p=>p.name.toLowerCase().includes(q)).map(p=>tr([esc(p.name),esc(p.category),fmt(p.quantity),fmt(p.min_quantity),p.quantity<=p.min_quantity?'منخفض':'متوفر'])))}
function filterReport(){const q=$('reportFilter').value.toLowerCase();$('reportTable').innerHTML=saleTable(window.reportItems.filter(s=>[s.product_name,s.worker,s.created_at].some(x=>String(x||'').toLowerCase().includes(q))),true)}
async function addSale(){await safe(async()=>{const name=$('sname').value.trim();const matches=products.filter(p=>p.name===name);let product_id=matches.length===1?matches[0].id:null;if(matches.length>1){const chosen=prompt('هناك أكثر من صنف بهذا الاسم. اكتب رقم الصنف المطلوب: '+matches.map(p=>`${p.id} (${p.category})`).join('، '));if(!chosen)return;product_id=matches.find(p=>String(p.id)===chosen)?.id;if(!product_id)throw Error('رقم الصنف غير صحيح')}await api('sales','POST',{product_name:name,product_id,quantity:Number($('sqty').value),amount:Number($('samount').value)});msg('تم تسجيل البيع');page('sales')})}
async function batchAdd(){await safe(async()=>{const lines=$('batch').value.split('\n').map(x=>x.trim()).filter(Boolean);const items=lines.map(l=>{const a=l.split('|').map(x=>x.trim());if(a.length<2)throw Error('كل سطر لازم يحتوي الاسم | الكمية | الحد الأدنى');return {name:a[0],quantity:Number(a[1]),min_quantity:Number(a[2]||0),category_id:Number($('cat').value)}});const r=await api('products/batch','POST',{items});msg(`تم حفظ ${r.count} صنف`);page('inventory')})}
async function stocktake(){await safe(async()=>{await api('stock/adjust','POST',{product_id:Number($('stockId').value),quantity:Number($('stockQty').value),reason:$('stockReason').value});msg('تم الجرد');page('inventory')})}
async function createUser(){await safe(async()=>{await api('users','POST',{username:$('un').value.trim(),display_name:$('ud').value.trim(),password:$('up').value,role:$('ur').value});msg('تم إنشاء الحساب');page('users')})}
async function deleteSale(id){if(!confirm('حذف البيع واسترجاع كميته للمخزون؟'))return;await safe(async()=>{await api('sales/'+id,'DELETE');msg('تم الحذف');page(current)})}
async function editSale(id,qty,amount){const q=prompt('الكمية الجديدة',qty);if(q===null)return;const a=prompt('إجمالي المبلغ الجديد',amount);if(a===null)return;await safe(async()=>{await api('sales/'+id,'PUT',{quantity:Number(q),amount:Number(a)});msg('تم التعديل');page(current)})}
init();</script></body></html>
